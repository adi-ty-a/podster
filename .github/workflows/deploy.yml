name: Production deploy

on:
  push:
    branches: [ prod ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Image build
    steps:
      - name: copy codebase
        uses: actions/checkout@v7
        with:
          ref: prod  

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile.socket
          push: true
          tags: dev4adi/podstersocketserver:${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: 
            DIRECT_URL: ${{secrets.DIRECT_URL}}
          file: dockerfiles/Dockerfile.node
          push: true
          tags: dev4adi/podsternodeserver:${{ github.sha }}

      - name: Deploy to vm
        uses: appleboy/ssh-action@v1
        with: 
          host: 3.111.47.140
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            cd podster
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose down
            docker compose up -d

      
            

      
